<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
    <style>
        div#area {
            font: normal 25pt Arial;
            background-color: green;
            color: white;
            width: 200px;
            height: 200px;
            text-align: center;
            line-height: 200px;
            border-radius: 200px;
        }
    </style>
</head>
<body>
    <div id="area" onclick="clicar()" onmouseenter="entrou()" onmouseout="saiu()">
        Interaja...
    </div>

    <script>
        var a = window.document.getElementById('area')
        function entrou(){
            a.innerText = 'Entrou'
            a.style.background = 'green'
        }

        function clicar(){
            a.innerText = 'Clicou!'
            a.style.background = 'red'
        }

        function saiu(){
            a.innerText = 'Saiu'
            a.style.background = 'purple'
        }

    </script>
</body>
</html>
