<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
    <style>
        div#area {
            font: normal 15pt Arial;
            background-color: green;
            color: white;
            width: 200px;
            height: 200px;
            text-align: center;
            line-height: 200px;

        }
    </style>
</head>
<body>
    <div id="area" onclick="cliclar()" onmouseenter="entrou()">
        Interaja...
    </div>

    <script>
        function cliclar() {
            var a = window.document.getElementById('area')
            a.innerText = 'Clicou!'
        }

        function entrou() {
            var b = window.document.getElementById('area')
            b.innerText = 'Entrou'
        }
    </script>
</body>
</html>
